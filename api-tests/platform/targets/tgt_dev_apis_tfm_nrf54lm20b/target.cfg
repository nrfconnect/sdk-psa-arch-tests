// UART device info
// ".num" is an instance count, not an instance ID: the generator emits
// uart[num] and the tests only ever read instance 0.
uart.num=1;
uart.0.base = 0; // Unused value

// Watchdog device info

// The instance driven on 54L non-secure is NRF_WDT31, but it is selected at
// compile time by PSA_TEST_WDT_INSTANCE in drivers/watchdog/nrf/nrf_wdt.c,
// which ignores the base address below.

watchdog.num = 1;
watchdog.0.base = 0x40109000;  // Unused value
watchdog.0.num_of_tick_per_micro_sec = 1;  // Unused value

watchdog.0.timeout_in_micro_sec_low    = 500000000; // Unused value
watchdog.0.timeout_in_micro_sec_medium = 500000000; // Unused value
watchdog.0.timeout_in_micro_sec_high   = 500000000; // Unused value
watchdog.0.timeout_in_micro_sec_crypto = 500000000; // Unused value

// Range of 1KB Non-volatile memory to preserve data over reset. Ex, NVRAM and FLASH
nvmem.num =1;
nvmem.0.start = 0; // Unused value;
nvmem.0.end = 0x3ff;
